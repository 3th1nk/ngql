services:
  metad:
    image: vesoft/nebula-metad:v3.8.0
    environment:
      - USER=root
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=metad
      - --ws_ip=metad
      - --port=9559
      - --heartbeat_interval_secs=1
    ports:
      - "9559:9559"
    networks:
      - nebula-net
  graphd:
    image: vesoft/nebula-graphd:v3.8.0
    environment:
      - USER=root
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
      - --heartbeat_interval_secs=1
    ports:
      - "9669:9669"
    depends_on:
      - metad
    networks:
      - nebula-net
  storaged:
    image: vesoft/nebula-storaged:v3.8.0
    environment:
      - USER=root
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=storaged
      - --ws_ip=storaged
      - --port=9779
      - --heartbeat_interval_secs=1
    depends_on:
      - metad
    networks:
      - nebula-net

networks:
  nebula-net:
    name: nebula-it-net
